<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>夏合宿2026個人ページ</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="safe-viewport">
      <div id="unity-container">
        <canvas
          id="unity-canvas"
          width=1080
          height=1920
          tabindex="-1"></canvas>

        <div id="unity-loading-bar">
          <div id="unity-loading-title">夏合宿2026個人ページ</div>
          <div id="unity-progress-track">
            <div id="unity-progress-bar"></div>
          </div>
        </div>

        <div id="unity-warning"></div>
      </div>
    </main>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBar = document.querySelector("#unity-progress-bar");
      const warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(message, type) {
        const item = document.createElement("div");
        item.textContent = message;
        item.className = type === "error" ? "error" : "warning";
        warningBanner.appendChild(item);
        warningBanner.style.display = "block";

        if (type !== "error") {
          window.setTimeout(() => {
            item.remove();
            warningBanner.style.display =
              warningBanner.children.length > 0
                ? "block"
                : "none";
          }, 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/Build_player.loader.js";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/Build_player.data.unityweb",
        frameworkUrl: buildUrl + "/Build_player.framework.js.unityweb",
        codeUrl: buildUrl + "/Build_player.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "夏合宿2026個人ページ",
        productVersion: "1.0",
        showBanner: unityShowBanner
      };

      config.devicePixelRatio = Math.min(
        window.devicePixelRatio || 1,
        2
      );


      loadingBar.style.display = "flex";

      const loaderScript = document.createElement("script");
      loaderScript.src = loaderUrl;
      loaderScript.onload = () => {
        createUnityInstance(
          canvas,
          config,
          progress => {
            progressBar.style.width =
              Math.round(progress * 100) + "%";
          }
        ).then(() => {
          loadingBar.style.display = "none";
        }).catch(message => {
          unityShowBanner(message, "error");
        });
      };

      document.body.appendChild(loaderScript);
    </script>
  </body>
</html>
